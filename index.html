<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="card">

        <div class="search">

            <input
                type="text"
                placeholder="Enter City Name"
                spellcheck="false">

            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>

        <div class="error">
            <p>❌ Invalid City Name</p>
        </div>

        <div class="weather">

            <img src="images/cloud.png" class="weather-icon" alt="Weather Icon">

            <h1 class="temp">22°C</h1>

            <p class="feels-like">Feels Like: 22°C</p>

            <h2 class="city">Vadodara</h2>

            <p class="description">Cloudy</p>

            <!-- Extra Weather Details -->

            <div class="extra-details">

                <div class="extra-box">
                    <h3 class="min-temp">0°C</h3>
                    <p>Min Temp</p>
                </div>

                <div class="extra-box">
                    <h3 class="max-temp">0°C</h3>
                    <p>Max Temp</p>
                </div>

                <div class="extra-box">
                    <h3 class="pressure">0 hPa</h3>
                    <p>Pressure</p>
                </div>

            </div>

            <!-- Humidity & Wind -->

            <div class="details">

                <div class="col">

                    <img src="images/humidity.png" alt="Humidity">

                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>

                </div>

                <div class="col">

                    <img src="images/wind.png" alt="Wind">

                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
